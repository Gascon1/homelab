# Copy to /etc/systemd/system/restic-rest-server.service.d/override.conf on the backup Pi.
[Unit]
# LISTEN is the Tailscale IP, which exists only once tailscaled is up
After=tailscaled.service
Wants=tailscaled.service
# Refuse to start without the drive, instead of filling the SD card
RequiresMountsFor=/srv/backup
# Keep retrying while Tailscale comes up; never give up
StartLimitIntervalSec=0

[Service]
ProtectSystem=strict
ReadWritePaths=/srv/backup
Restart=always
RestartSec=10
