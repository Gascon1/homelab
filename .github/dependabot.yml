version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Rack base image (node:24-alpine) and npm dependencies
  - package-ecosystem: docker
    directory: /rack
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories: [/rack/server, /rack/web]
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
