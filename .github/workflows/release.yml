name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reuses the CI workflow; its checks appear as "ci / rack" etc.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Check run is named exactly "release" (no `name:` set); the deploy gate keys on it.
  release:
    needs: ci
    # workflow_dispatch can pick any branch: never push :main from another one
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rack
          file: rack/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gascon1/homelab-rack:sha-${{ github.sha }}
            ghcr.io/gascon1/homelab-rack:main
          labels: |
            org.opencontainers.image.source=https://github.com/Gascon1/homelab
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=homelab-rack
            org.opencontainers.image.description=Homelab rack dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max
