name: homelab

# ---------- DRY helpers ----------
x-ls-common: &ls-common
  restart: unless-stopped
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    # Optional: make downloaded/created files group-writable
    - UMASK=002
  networks:
    - homelab
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

# ---------- Services ----------
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    networks: [homelab]
    environment:
      - TZ=${TZ}
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - ${APPDATA}/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - rack.enable=true
    restart: unless-stopped

  rack:
    build: ./rack
    pull_policy: build
    container_name: rack
    environment:
      - TZ=${TZ}
      - PORT=4000
      - RACK_IMMICH_API_KEY=${RACK_IMMICH_API_KEY:-}
      - RACK_QBITTORRENT_USERNAME=${RACK_QBITTORRENT_USERNAME:-}
      - RACK_QBITTORRENT_PASSWORD=${RACK_QBITTORRENT_PASSWORD:-}
      # Normally discovered automatically from the read-only config mounts below
      - RACK_PLEX_TOKEN=${RACK_PLEX_TOKEN:-}
      - RACK_SONARR_API_KEY=${RACK_SONARR_API_KEY:-}
      - RACK_RADARR_API_KEY=${RACK_RADARR_API_KEY:-}
      - RACK_PROWLARR_API_KEY=${RACK_PROWLARR_API_KEY:-}
      - RACK_SEERR_API_KEY=${RACK_SEERR_API_KEY:-}
    networks: [homelab]
    ports:
      - '4000:4000' # Open at http://<server>:4000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APPDATA}/rack:/config
      - ${APPDATA}/sonarr:/appdata/sonarr:ro
      - ${APPDATA}/radarr:/appdata/radarr:ro
      - ${APPDATA}/prowlarr:/appdata/prowlarr:ro
      - ${APPDATA}/seerr:/appdata/seerr:ro
      - ${APPDATA}/plex:/appdata/plex:ro
      - ${DATA_DIR}:/mnt/data:ro
    healthcheck:
      test: ['CMD', 'node', '/app/server.mjs', '--healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    networks: [homelab]
    # Publish only what you need to reach from LAN
    ports:
      - '32400:32400/tcp' # Plex web/API
      # If you actually use DLNA/auto-discovery, also add these:
      - '1900:1900/udp' # SSDP discovery
      - '32410:32410/udp' # GDM discovery
      - '32412:32412/udp'
      - '32413:32413/udp'
      - '32414:32414/udp'
      - '32469:32469/tcp' # DLNA
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - ADVERTISE_IP=${HOST_ADDR}:32400/
    volumes:
      # Make paths match the *arr containers to avoid path-mapping pain
      - ${DATA_DIR}:/data
      - ${APPDATA}/plex:/config
    labels:
      - rack.enable=true
    restart: unless-stopped

  qbittorrent:
    <<: *ls-common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      # a service-level list replaces the anchor's list, so repeat the shared vars
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      - WEBUI_PORT=8080
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${DATA_DIR}/torrents:/data/torrents
    ports:
      - '8080:8080'
      - '6881:6881'
      - '6881:6881/udp'
    labels:
      - rack.enable=true
      - rack.port=8080 # Web UI; the default (lowest published port) would pick 6881
    stop_grace_period: 30s # Let qB save state cleanly

  radarr:
    <<: *ls-common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ${APPDATA}/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - '7878:7878'
    labels:
      - rack.enable=true

  sonarr:
    <<: *ls-common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - '8989:8989'
    labels:
      - rack.enable=true

  prowlarr:
    <<: *ls-common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ${APPDATA}/prowlarr:/config
    ports:
      - '9696:9696'
    labels:
      - rack.enable=true

  flaresolverr:
    <<: *ls-common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    ports:
      - '8191:8191'
    labels:
      - rack.enable=true

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    env_file: .env
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    ports:
      - '2283:2283' # or "8088:2283" if you prefer that external port
    restart: always
    networks: [homelab]
    labels:
      - rack.enable=true

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    env_file: .env
    volumes:
      - model-cache:/cache
    restart: always
    networks: [homelab]

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:a137a2b60aca1a75130022d6bb96af423fefae4eb55faf395732db3544803280
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping || exit 1']
    restart: always
    networks: [homelab]

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # DB_STORAGE_TYPE: "HDD"   # uncomment if your DB is on HDD
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    networks: [homelab]

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    # Keep host PID so Netdata can see host processes; just switch network
    pid: host
    networks: [homelab]
    ports:
      - '19999:19999/tcp'
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./appdata/netdata/config:/etc/netdata
      - ./appdata/netdata/lib:/var/lib/netdata
      - ./appdata/netdata/cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - rack.enable=true

  filebrowser:
    <<: *ls-common
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    # run as same user as your other app data
    user: '${PUID}:${PGID}'
    volumes:
      # Browse the same data tree your media stack uses
      - ${DATA_DIR}:/srv
      # Config + DB so settings survive rebuilds
      - ${APPDATA}/filebrowser/config:/config
      - ${APPDATA}/filebrowser/database:/database
    ports:
      - '8181:80'
    labels:
      - rack.enable=true
volumes:
  model-cache:

# ---------- Networks ----------
networks:
  homelab:
    name: homelab
